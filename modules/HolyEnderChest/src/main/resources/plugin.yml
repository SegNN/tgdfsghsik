name: HolyEnderChest
main: ua.holydev.holyenderchest.HolyEnderChest
version: 1.0
api-version: 1.16
author:
  - FichaDev
  - Smail
depend:
  - PlayerPoints
commands:
  ec:
    permission: holyenderchest.ec
    aliases: [enderchest]
  enderchest:
    permission: holyenderchest.ec

permissions:
  holyenderchest.ec:
    description: Разрешает использовать эндер-сундук
    default: true
  holyenderchest.ec.admin:
    description: Разрешает использовать админские команды
    default: op
    children:
      - holyenderchest.ec
  holyenderchest.ec.view:
    description: Разрешает просматривать эндер-сундуки других игроков
    default: op
  holyenderchest.ec.take:
    description: Позволяет забирать предметы из чужого эндер-сундука
    default: op
