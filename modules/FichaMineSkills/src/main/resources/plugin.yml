name: FichaMineSkills
version: 1.0
main: ua.fichamine.fichamineskills.FichaMineSkills
api-version: 1.16
authors:
  - KotikStasika
  - FichaDev
  - Smail
description: 'Современный плагин для системы бонусов и очков в автошахте с интеграцией WorldGuard, PlaceholderAPI и DecentHolograms'

depend:
  - WorldEdit
  - WorldGuard
  - PlaceholderAPI
  - DecentHolograms

softdepend:
  - WorldEdit
  - WorldGuard
  - PlaceholderAPI
  - DecentHolograms

commands:
  mineskills:
    permission: 'fichamineskills.use'
    permission-message: 'У вас нет прав для использования этой команды!'

permissions:
  fichamineskills.use:
    default: true
  fichamineskills.admin:
    default: op
  fichamineskills.reload:
    default: op