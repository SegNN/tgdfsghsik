# HolyClans — клановая система.

# Стоимость создания клана (монеты).
creation-cost: 5000000

# Максимальная длина названия клана.
max-name-length: 12

# Стоимость одного кланового очка (монеты).
point-cost: 15000

# Стоимость открытия одного слота участника (монеты).
slot-cost: 1000000

# Начальное количество слотов в клане (лидер + участники).
initial-slots: 2

# Сколько секунд длится приглашение в клан.
invite-timeout-seconds: 300

# Сколько сообщений спамить для подтверждений delete/newleader.
confirm-spam-count: 10

# Требования для повышения уровня клана:
# level -> {points: N, treasury: N}
level-requirements:
  2:
    points: 1
    treasury: 100000
  3:
    points: 3
    treasury: 300000
  4:
    points: 6
    treasury: 600000
  5:
    points: 10
    treasury: 1000000
  6:
    points: 15
    treasury: 1500000
  7:
    points: 21
    treasury: 2100000
  8:
    points: 28
    treasury: 2800000
  9:
    points: 36
    treasury: 3600000
  10:
    points: 45
    treasury: 4500000

# Клановые хом-точки: сколько часов наигрыша лидера нужно для каждой.
home-points:
  # первая точка — после N часов
  1: 10
  2: 28
  3: 46

# Цвета брони для подсветки соклановцев (RGB).
glow-colors:
  - 16711680    # красный
  - 16744448    # оранжевый
  - 16776960    # жёлтый
  - 65280       # зелёный
  - 65535       # голубой
  - 255         # синий
  - 8388863     # фиолетовый
  - 16761035    # розовый
  - 16777215    # белый
  - 0           # чёрный
  - 8421504     # серый
  - 11184810    # светло-серый
  - 5592405     # тёмно-серый
  - 8388608     # тёмно-красный
  - 128         # тёмно-синий
  - 32768       # тёмно-зелёный
  - 32896       # тёмно-голубой
  - 8388736     # тёмно-фиолетовый
  - 16744576    # коралловый
  - 3329330     # изумрудный
  - 16766720    # золотой
  - 9127187     # лаванда
  - 3394815     # ледяной
