# Каталог Скупщика. Цены - те же, что в вики режима ("Начальная цена").
#
# price   - начальная цена за штуку; со временем она гуляет вокруг этого значения:
#           чем больше сервер сдал товара, тем ниже становится "стандартная цена".
# points  - очки Скупщика за штуку. Если не задать, берётся price * points-ratio из config.yml.
# materials - все предметы, которые принимаются по этой цене (варианты дерева, цвета шерсти).
# potion  - для зелий: тип из PotionType. Обычное зелье и зелье силы стоят по-разному,
#           поэтому материала POTION мало, нужен ещё тип эффекта.

