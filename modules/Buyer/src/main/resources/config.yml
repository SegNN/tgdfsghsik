# Скупщик.
#
# Начальные цены товаров лежат в items.yml, витрина магазина - в shop.yml.
# Здесь настраивается то, как эти цены гуляют.

# Сколько очков скупщика даёт товар, если в items.yml у него не задано points.
points-ratio: 0.2

supply:
  # За сколько часов счётчик сдач падает вдвое. Из-за него забытый товар
  # постепенно возвращается к начальной цене, а заезженный остаётся дешёвым.
  half-life-hours: 72.0

  # Сколько монет должен сдать весь сервер, чтобы стандартная цена товара упала вдвое.
  # Порог в монетах, а не в штуках: иначе булыжник и незерит вели бы себя одинаково.
  global-target-coins: 50000000.0
  # Ниже этой доли от начальной цены товар не опускается.
  min-factor: 0.25

  # Сколько монет должен сдать лично игрок, чтобы его личный коэффициент упал
  # с максимума до минимума. Это и есть "Сдали мало / Сдали много" в описании товара.
  personal-target-coins: 500000.0
  personal-max-percent: 300.0
  personal-min-percent: -60.0

multiplier:
  # Базовый коэффициент: за каждые points-per-step накопленных очков он растёт
  # на percent-per-step процентов. У обладателей buyer.stinger - вдвое быстрее.
  points-per-step: 1000.0
  percent-per-step: 1.0
  percent-per-step-stinger: 2.0
  cap-percent: 400.0

auto-sell:
  # Как часто авто-скупщик разбирает инвентарь, в тиках.
  period-ticks: 100

fragments:
  # Боевой фрагмент - предмет из другого плагина, поэтому узнаём его по виду.
  material: PRISMARINE_SHARD
  name-contains: 'Боевой фрагмент'
  # Сколько процентов даёт одна покупка локального бонуса.
  bonus-percent: 20.0

ulta:
  bonus-percent: 10.0

shop:
  # Сколько часов после вайпа магазин закрыт.
  closed-hours: 24
  # На сколько дорожает сменный товар после каждой покупки.
  # Накрутка сбрасывается трижды в сутки: в 00:00, 08:00 и 16:00 по МСК.
  price-growth: 0.05
