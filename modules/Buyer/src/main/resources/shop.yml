# Магазин скупщика (/b shop).
#
# Товары бывают двух видов:
#   fixed: true  - постоянный. Всегда лежит на своём slot и стоит одинаково весь вайп.
#   fixed: false - сменный. Раз в сутки товары тасуются, и на витрину попадает только
#                  rotating-visible штук, поэтому купить всё сразу нельзя. Цена растёт
#                  с каждой покупкой и трижды в сутки сбрасывается обратно.
#
# Что делает покупка:
#   action: EXP            - выдать amount опыта
#   action: BUYER_BOOSTER  - бустер скупщика +percent% на minutes минут
#   action: ULTA           - Ульта Скупщика на minutes минут
#   give: true             - выдать сам предмет с витрины
#   commands: [...]        - выполнить от консоли, %player% заменяется на ник
#
# ВАЖНО: у товаров из чужих плагинов (кирки, ботинки, яйца, контейнер) списки commands
# пустые - подставьте туда команды выдачи своих плагинов. Пока список пуст и нет ни
# give, ни action, скупщик откажет в покупке и не спишет очки.

