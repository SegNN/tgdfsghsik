name: Buyer
version: '2.0'
main: org.impldev.holybuyer.HolyBuyer
api-version: '1.21'
author: HolyZako
description: Скупщик - продажа ресурсов за монеты и очки скупщика
depend: [Vault]
softdepend: [PlaceholderAPI, HolyCore]
commands:
  buyer:
    description: Меню Скупщика
    usage: /buyer [auto|shop|items|settings]
  b:
    description: Меню Скупщика
    usage: /b [auto|shop|items|settings]
permissions:
  buyer.stinger:
    description: Базовый коэффициент растёт вдвое быстрее
    default: false
