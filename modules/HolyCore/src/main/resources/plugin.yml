name: HolyCore
version: '0.1'
main: org.impldev.holycore.HolyCore
api-version: '1.16'
commands:
  afk:
    description: Включить/выключить режим AFK
    usage: /afk
    permission: holycore.afk.use
  broadcast:
    aliases: [bc]
    permission: holycore.bc.use
  suicide:
    permission: holycore.suicide.use
  links:
    aliases: [сообщества, тгк, дискорд, сайт]
  wolker:
    description: Сообщение о выдаче оператора в ванильном оформлении
    usage: /wolker
    permission: holycore.wolker.use
  healthindicator:
    description: Включить/выключить показ здоровья над игроками
    usage: /healthindicator
    permission: holycore.healthindicator.use
  baltop:
    description: Топ богачей, места 1-10
    usage: /baltop
    permission: holycore.baltop.use
  baltop2:
    description: Топ богачей, места 11-20
    usage: /baltop2
    permission: holycore.baltop.use
  baltop3:
    description: Топ богачей, места 21-30
    usage: /baltop3
    permission: holycore.baltop.use
  wextend:
    description: Куда переехало расширение миров
    usage: /wextend
    permission: holycore.wextend.use
  invest:
    description: Меню инвестиций
    usage: /invest
    permission: holycore.invest.use
permissions:
  holycore.wolker.use:
    default: true
  holycore.healthindicator.use:
    default: true
  holycore.baltop.use:
    default: true
  holycore.wextend.use:
    default: true
  holycore.invest.use:
    default: true
