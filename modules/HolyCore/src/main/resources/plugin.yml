name: HolyCore
version: '0.1'
main: org.impldev.holycore.HolyCore
api-version: '1.16'
commands:
  afk:
    description: Включить/выключить режим AFK
    usage: /afk
    permission: holycore.afk.use
  broadcast:
    aliases: [bc]
    permission: holycore.bc.use
  suicide:
    permission: holycore.suicide.use
  links:
    aliases: [сообщества, тгк, дискорд, сайт]
  wolker:
    description: Сообщение о выдаче оператора в ванильном оформлении
    usage: /wolker
    permission: holycore.wolker.use
  healthindicator:
    description: Включить/выключить показ здоровья над игроками
    usage: /healthindicator
    aliases: [hi, хп]
    permission: holycore.healthindicator.use
permissions:
  holycore.wolker.use:
    default: true
  holycore.healthindicator.use:
    default: true
